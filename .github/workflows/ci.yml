name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --dev

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check selfhswarm tests demo_server.py

      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -q

      - name: CLI smoke test
        run: uv run --python ${{ matrix.python-version }} okto --help

      - name: Build package
        run: uv build --python ${{ matrix.python-version }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --dev

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check selfhswarm tests demo_server.py

      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -q

      - name: CLI smoke test
        run: uv run --python ${{ matrix.python-version }} okto --help

      - name: Build package
        run: uv build --python ${{ matrix.python-version }}

  korg-compat:
    name: Korg compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out Korg (pinned in scripts/korg_compat/run.sh)
        uses: actions/checkout@v4
        with:
          repository: New1Direction/korg
          ref: b26e1f43548d9a7b1a5f5310efd426b2e5e63068
          path: .korg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/korg_compat/rust

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Verify Okto exports with Korg's verifiers
        run: scripts/korg_compat/run.sh

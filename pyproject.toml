[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selfhswarm"
version = "0.1.0"
description = "Self-mutating swarm proxy for AI coding agents — live editor, chaos harness, distributed genome"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ares" }]
keywords = ["llm", "proxy", "agent", "mitmproxy", "swarm", "chaos-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Layer 1: proxy core (aiohttp-native, no mitmproxy)
    "aiohttp>=3.9,<4",
    "cryptography>=42.0",  # TLS termination + self-signed CA
    "backports-zstd>=1.0; python_version < '3.14'",
    # Layer 2: camouflage + data
    "pydantic>=2.0",
    "orjson>=3.9",
    # Layer 3: RNA bus
    "websockets>=12.0",
    # Viewer
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # CLI
    "click>=8.1",
    "rich>=13.0",
    # MCP server
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
selfhswarm = "selfhswarm.cli:main"

# Keep heavy, unused binary assets (3D model exports, marketing video) out of
# every built artifact regardless of VCS tracking.
[tool.hatch.build]
exclude = ["**/*.glb", "**/*.mp4"]

# The sdist ships only the package and its metadata — not the marketing site
# under docs/ or the root-level screenshots used in the README/dev process.
[tool.hatch.build.targets.sdist]
include = ["selfhswarm", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["selfhswarm"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
